[package]
name = "sevenxair"
version = "0.1.0"
description = "7xAir Windows 10/11 Minecraft Launcher"
authors = ["7xAir Contributors"]
edition = "2021"

[lib]
name = "sevenxair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
