name: 7xAir Updater Safe Test Pre-Release

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: "Test pre-release SemVer tag (e.g., 0.1.1-test.1) — must be higher than current installed version"
        required: true
        default: "0.1.1-test.1"

permissions:
  contents: write

jobs:
  build-test-prerelease:
    name: Build & Publish Separate Pre-Release for Updater Testing
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS installer
        working-directory: apps/launcher
        run: npm run tauri:build

      - name: Compute SHA-256 checksums for updater verification
        shell: pwsh
        run: |
          $nsisDir = "apps/launcher/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No NSIS .exe found" }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -FilePath "$nsisDir/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$nsisDir/SHA256SUMS.txt"

      - name: Publish separate GitHub Pre-Release (beta channel only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.test_version }}
          name: "7xAir Updater Test v${{ github.event.inputs.test_version }}"
          prerelease: true
          generate_release_notes: true
          body: |
            Separate pre-release build for safely testing the 7xAir auto-updater on the **Beta** release channel.
            Does not affect **Stable** channel users or overwrite existing user data.
          files: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
