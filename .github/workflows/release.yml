name: 7xAir Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-fabric-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build 7xAir Fabric client bundles (1.21.11 & 26.2) for internal launcher embedding
        working-directory: client/7xair-fabric
        run: |
          chmod +x scripts/build-targets.sh
          ./scripts/build-targets.sh || echo "Targets require official Mojang/Fabric availability"
      - name: Upload internal client bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7xair-client-bundles
          path: apps/launcher/src-tauri/resources/client-bundles/
          if-no-files-found: ignore

  build-windows-installer:
    needs: build-fabric-bundles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Download internal client bundles
        uses: actions/download-artifact@v4
        with:
          name: 7xair-client-bundles
          path: apps/launcher/src-tauri/resources/client-bundles/
        continue-on-error: true
      - name: Install launcher dependencies and build Windows NSIS EXE
        working-directory: apps/launcher
        env:
          SEVENXAIR_MSA_CLIENT_ID: ${{ secrets.SEVENXAIR_MSA_CLIENT_ID }}
        run: |
          npm install
          npm run tauri:build
      - name: Compute SHA-256 and publish Windows EXE only to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "apps/launcher/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS EXE installer not found" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "SHA256SUMS.txt"
          Write-Host "Installer: $($exe.Name) | SHA-256: $hash"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ inputs.version }}" }
          gh release create $tag $exe.FullName SHA256SUMS.txt --title "7xAir $tag" --notes "Windows 10/11 NSIS installer. The 7xAir Fabric Client is managed automatically inside the launcher."
